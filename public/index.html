<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>📍 Live Location Monitor - Background Geolocation</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: #1e293b;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      z-index: 1000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 1.5rem;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #38bdf8;
    }

    .brand-subtitle {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat-badge {
      background: #334155;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-badge strong {
      color: #38bdf8;
    }

    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .btn-danger {
      background: #dc2626;
    }

    .btn-danger:hover {
      background: #b91c1c;
    }

    #main-container {
      display: flex;
      flex: 1;
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    #map {
      flex: 1;
      height: 100%;
      background: #090d16;
    }

    #sidebar {
      width: 380px;
      background: #1e293b;
      border-left: 1px solid #334155;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid #334155;
      font-weight: 600;
      font-size: 0.9rem;
      color: #cbd5e1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .location-list {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .location-list::-webkit-scrollbar {
      width: 6px;
    }

    .location-list::-webkit-scrollbar-track {
      background: #0f172a;
    }

    .location-list::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    .location-list::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    .location-card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .location-card:hover {
      border-color: #38bdf8;
      transform: translateY(-1px);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .device-tag {
      background: #0284c7;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .timestamp {
      color: #94a3b8;
      font-size: 0.75rem;
    }

    .coords {
      font-family: monospace;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      color: #cbd5e1;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
      line-height: 1.5;
    }

    .leaflet-popup-content-wrapper {
      background: #1e293b;
      color: #f8fafc;
      border-radius: 8px;
      padding: 4px;
      border: 1px solid #334155;
    }

    .leaflet-popup-tip {
      background: #1e293b;
    }

    .popup-title {
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 6px;
      font-size: 0.9rem;
    }

    .popup-item {
      font-size: 0.8rem;
      margin-bottom: 3px;
      color: #cbd5e1;
    }

    @media (max-width: 768px) {
      #main-container {
        flex-direction: column;
      }

      #sidebar {
        width: 100%;
        height: 45vh;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <span class="brand-icon">📍</span>
      <div>
        <div class="brand-title">TrackIt Location Server</div>
        <div class="brand-subtitle">react-native-trackit Live Feed</div>
      </div>
    </div>
    <div class="stats-bar">
      <div class="stat-badge">Total Updates: <strong id="stat-count">0</strong></div>
      <div class="stat-badge">Devices: <strong id="stat-devices">0</strong></div>
      <button class="btn" id="btn-refresh" onclick="fetchLocations()">🔄 Refresh</button>
      <button class="btn btn-danger" onclick="clearLocations()">🗑️ Clear</button>
    </div>
  </header>

  <div id="main-container">
    <div id="map"></div>
    <div id="sidebar">
      <div class="sidebar-header">
        <span>Incoming Logs Feed</span>
        <div style="display: flex; gap: 10px; align-items: center; font-size: 0.75rem; font-weight: normal;">
          <label style="cursor: pointer;">
            <input type="checkbox" id="show-path" checked /> Show Path
          </label>
          <label style="cursor: pointer;">
            <input type="checkbox" id="follow-latest" checked /> Follow Device
          </label>
          <label style="cursor: pointer;">
            <input type="checkbox" id="auto-refresh" checked /> Auto Refresh (2s)
          </label>
        </div>
      </div>
      <div class="location-list" id="location-list">
        <div class="empty-state">No locations received yet.<br />Send a POST request to <code>/locations</code></div>
      </div>
    </div>
  </div>

  <script>
    let map = L.map('map').setView([37.7749, -122.4194], 12);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 20
    }).addTo(map);

    let markersGroup = L.featureGroup().addTo(map);
    let polylineGroup = L.featureGroup().addTo(map);
    let geofencesGroup = L.featureGroup().addTo(map);
    let autoRefreshInterval = null;
    let lastPointCount = -1;

    function parseDate(isoString) {
      if (!isoString) return new Date();
      const cleaned = (typeof isoString === 'string' && isoString.endsWith('Z')) ? isoString.slice(0, -1) : isoString;
      return new Date(cleaned);
    }

    async function fetchLocations() {
      try {
        const res = await fetch('/locations?format=json&t=' + Date.now(), {
          headers: { 'Cache-Control': 'no-cache' }
        });
        const data = await res.json();
        renderData(data.locations || []);
      } catch (err) {
        console.error('Failed to fetch locations', err);
      }
    }

    async function clearLocations() {
      if (!confirm('Are you sure you want to clear all stored locations?')) return;
      try {
        await fetch('/locations', { method: 'DELETE' });
        lastPointCount = -1;
        fetchLocations();
      } catch (err) {
        alert('Failed to clear locations');
      }
    }

    function renderData(locations) {
      document.getElementById('stat-count').innerText = locations.length;

      const devices = new Set(locations.map(l => l.device_id || 'unknown'));
      document.getElementById('stat-devices').innerText = devices.size;

      markersGroup.clearLayers();
      polylineGroup.clearLayers();
      geofencesGroup.clearLayers();

      const listContainer = document.getElementById('location-list');
      const savedScrollTop = listContainer.scrollTop;
      listContainer.innerHTML = '';

      if (locations.length === 0) {
        listContainer.innerHTML = `<div class="empty-state">No locations received yet.<br/>Send a POST request to <code>/locations</code></div>`;
        return;
      }

      // Group locations by device for polylines in chronological order
      const devicePaths = {};
      const boundsPoints = [];

      const chronologicalLocs = [...locations].sort((a, b) => {
        const tA = new Date(a.timestamp || 0).getTime();
        const tB = new Date(b.timestamp || 0).getTime();
        return tA - tB;
      });

      chronologicalLocs.forEach(loc => {
        const coords = loc.coords || loc;
        const lat = Number(coords.latitude ?? loc.latitude);
        const lng = Number(coords.longitude ?? loc.longitude);
        if (isNaN(lat) || isNaN(lng)) return;
        const devId = loc.device_id || 'unknown';
        if (!devicePaths[devId]) devicePaths[devId] = [];
        devicePaths[devId].push([lat, lng]);
      });

      // Sort newest first for sidebar display
      const displayLocations = [...locations].reverse();

      displayLocations.forEach((loc, index) => {
        const coords = loc.coords || loc;
        const lat = Number(coords.latitude ?? loc.latitude);
        const lng = Number(coords.longitude ?? loc.longitude);
        if (isNaN(lat) || isNaN(lng)) return;

        boundsPoints.push([lat, lng]);

        // Add marker
        const isLatest = index === 0;
        const marker = L.circleMarker([lat, lng], {
          radius: isLatest ? 10 : 6,
          fillColor: isLatest ? '#22c55e' : '#38bdf8',
          color: '#ffffff',
          weight: isLatest ? 3 : 1.5,
          opacity: 1,
          fillOpacity: 0.9
        });

        const gf = loc.geofence || (loc.extras && loc.extras.geofence);
        const timeStr = loc.timestamp ? parseDate(loc.timestamp).toLocaleTimeString() : 'N/A';
        const dateStr = loc.timestamp ? parseDate(loc.timestamp).toLocaleDateString() : '';

        // Battery formatting
        const batt = loc.battery || {};
        const battLevel = batt.level != null ? Math.round(batt.level * 100) + '%' : 'N/A';
        const isCharging = batt.is_charging ?? batt.isCharging ?? false;
        const isPowerSave = batt.is_power_save_mode ?? batt.isPowerSaveMode ?? false;

        // Permission formatting
        const perm = loc.permission || {};
        const permStatusName = perm.statusName || (perm.status !== undefined ? `Code ${perm.status}` : null);
        const permFlags = [];
        if (perm.hasFinePermission !== undefined) permFlags.push(`Fine: ${perm.hasFinePermission ? '✓' : '✗'}`);
        if (perm.hasCoarsePermission !== undefined) permFlags.push(`Coarse: ${perm.hasCoarsePermission ? '✓' : '✗'}`);
        if (perm.hasBackgroundPermission !== undefined) permFlags.push(`Bg: ${perm.hasBackgroundPermission ? '✓' : '✗'}`);
        if (perm.hasAlwaysPermission !== undefined) permFlags.push(`Always: ${perm.hasAlwaysPermission ? '✓' : '✗'}`);
        if (perm.hasWhenInUsePermission !== undefined) permFlags.push(`WhenInUse: ${perm.hasWhenInUsePermission ? '✓' : '✗'}`);

        const popupContent = `
          <div class="popup-title">📱 Device: ${loc.device_id || 'unknown'}</div>
          <div class="popup-item">📍 <b>Lat/Lng:</b> ${lat.toFixed(6)}, ${lng.toFixed(6)}</div>
          <div class="popup-item">🎯 <b>Accuracy:</b> ±${Math.round(coords.accuracy || 0)}m</div>
          <div class="popup-item">⚡ <b>Speed:</b> ${((coords.speed || 0) * 3.6).toFixed(1)} km/h (${(coords.speed || 0).toFixed(1)} m/s)</div>
          <div class="popup-item">🚶 <b>Moving:</b> ${loc.is_moving ?? loc.isMoving ?? 'N/A'}</div>
          <div class="popup-item">🏃 <b>Activity:</b> ${loc.activity?.type || 'unknown'} (${loc.activity?.confidence || 0}%)</div>
          <div class="popup-item">🔋 <b>Battery:</b> ${battLevel} ${isCharging ? '⚡ (Charging)' : ''} | <b>Power Saver:</b> ${isPowerSave ? '<span style="color:#f59e0b;font-weight:bold;">ON 🪫</span>' : '<span style="color:#10b981;">OFF</span>'}</div>
          ${permStatusName ? `<div class="popup-item">🛡️ <b>Permission:</b> <span style="color:${permStatusName === 'Denied' || permStatusName === 'Restricted' ? '#ef4444' : '#38bdf8'};font-weight:600;">${permStatusName}</span> ${permFlags.length ? `<span style="font-size:0.75rem;color:#94a3b8;">[${permFlags.join(', ')}]</span>` : ''}</div>` : ''}
          ${loc.event ? `<div class="popup-item" style="color: #ef4444; margin-top: 4px; font-weight: bold;">⚠️ <b>Event:</b> ${loc.event}</div>` : ''}
          ${gf ? `<div class="popup-item" style="color: #a78bfa; margin-top: 4px; font-weight: bold;">🚩 <b>Fence:</b> ${gf.identifier} [Key: ${gf.key || gf.identifier}] (${gf.status || gf.action})</div>` : ''}
          <div class="popup-item">🕒 <b>Time:</b> ${dateStr} ${timeStr}</div>
        `;

        marker.bindPopup(popupContent);
        markersGroup.addLayer(marker);

        // Sidebar Card
        const card = document.createElement('div');
        card.className = 'location-card';
        card.innerHTML = `
          <div class="card-top">
            <span class="device-tag">${loc.device_id || 'unknown'}</span>
            <div style="display: flex; align-items: center; gap: 6px;">
              <span class="timestamp">${timeStr}</span>
              ${loc.id ? `<button onclick="deleteRecord('${loc.id}', event)" title="Delete this single location record" style="background: none; border: none; color: #f43f5e; cursor: pointer; font-size: 0.8rem; padding: 0 2px;">🗑️</button>` : ''}
            </div>
          </div>
          <div class="coords">${lat.toFixed(5)}, ${lng.toFixed(5)}</div>
          <div class="details-grid">
            <span>Acc: ±${Math.round(coords.accuracy || 0)}m</span>
            <span>Speed: ${(coords.speed || 0).toFixed(1)}m/s</span>
            <span>Activity: ${loc.activity?.type || 'N/A'}</span>
            <span>Batt: ${battLevel} ${isCharging ? '⚡' : ''}</span>
          </div>
          <div style="margin-top: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem;">
            ${permStatusName ? `<span style="color: ${permStatusName === 'Denied' || permStatusName === 'Restricted' ? '#ef4444' : '#38bdf8'}; font-weight: 600;">🛡️ Perm: <b>${permStatusName}</b></span>` : '<span></span>'}
            <span style="color: ${isPowerSave ? '#f59e0b' : '#94a3b8'}; font-weight: 500;">🪫 Saver: <b style="color: ${isPowerSave ? '#f59e0b' : '#64748b'};">${isPowerSave ? 'ON' : 'OFF'}</b></span>
          </div>
          ${loc.event ? `<div style="margin-top: 6px; padding: 4px 8px; background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 4px; color: #ef4444; font-weight: 600; font-size: 0.75rem;">⚠️ Event: ${loc.event}</div>` : ''}
          ${gf ? `<div style="margin-top: 6px; padding: 4px 8px; background: rgba(139,92,246,0.2); border: 1px solid rgba(139,92,246,0.4); border-radius: 4px; color: #a78bfa; font-weight: 600; font-size: 0.75rem;">🚩 Fence: ${gf.identifier} [Key: ${gf.key || gf.identifier}] (${gf.status || gf.action})</div>` : ''}
        `;
        card.onclick = () => {
          map.setView([lat, lng], 16, { animate: true });
          marker.openPopup();
        };
        listContainer.appendChild(card);
      });

      if (savedScrollTop > 0) {
        listContainer.scrollTop = savedScrollTop;
      }

      // Render single geofence circle per unique geofence identifier
      const uniqueGeofences = {};
      displayLocations.forEach(loc => {
        const gf = loc.geofence || (loc.extras && loc.extras.geofence);
        if (gf && gf.identifier) {
          if (!uniqueGeofences[gf.identifier]) {
            uniqueGeofences[gf.identifier] = { gf, loc };
          }
        }
      });

      Object.values(uniqueGeofences).forEach(({ gf, loc }) => {
        const coords = loc.coords || loc;
        const lat = Number(coords.latitude ?? loc.latitude);
        const lng = Number(coords.longitude ?? loc.longitude);
        const gfLat = Number(gf.latitude ?? lat);
        const gfLng = Number(gf.longitude ?? lng);
        const status = gf.status || gf.action || 'ACTIVE';
        const radius = Number(gf.radius || 150);
        const color = status === 'ENTER' ? '#22c55e' : status === 'EXIT' ? '#ef4444' : '#8b5cf6';

        const fenceCircle = L.circle([gfLat, gfLng], {
          radius: radius,
          color: color,
          fillColor: color,
          fillOpacity: 0.2,
          weight: 2
        });

        fenceCircle.bindPopup(`
          <div class="popup-title">🚩 Geofence: ${gf.identifier}</div>
          <div class="popup-item">🔑 <b>Key:</b> <code>${gf.key || gf.identifier}</code></div>
          <div class="popup-item">🎯 <b>Latest Status:</b> ${status}</div>
          <div class="popup-item">📍 <b>Center:</b> ${gfLat.toFixed(6)}, ${gfLng.toFixed(6)}</div>
          <div class="popup-item">📏 <b>Radius:</b> ${radius}m</div>
        `);
        geofencesGroup.addLayer(fenceCircle);
      });

    function calculateBearing(lat1, lon1, lat2, lon2) {
      const rad = Math.PI / 180;
      const dLon = (lon2 - lon1) * rad;
      const y = Math.sin(dLon) * Math.cos(lat2 * rad);
      const x = Math.cos(lat1 * rad) * Math.sin(lat2 * rad) - Math.sin(lat1 * rad) * Math.cos(lat2 * rad) * Math.cos(dLon);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    async function deleteRecord(recordId, event) {
      if (event) event.stopPropagation();
      if (!confirm('Delete this single location record?')) return;
      try {
        await fetch('/locations/record/' + encodeURIComponent(recordId), { method: 'DELETE' });
        fetchLocations();
      } catch (err) {
        alert('Failed to delete record');
      }
    }

    // Draw polyline paths per device (connecting all received points continuously with direction arrows)
    const showPath = document.getElementById('show-path')?.checked ?? true;
    if (showPath) {
      Object.keys(devicePaths).forEach((devId) => {
        const path = devicePaths[devId];
        if (path.length > 1) {
          const polyline = L.polyline(path, {
            color: '#38bdf8',
            weight: 3,
            opacity: 0.8,
            dashArray: '6, 8'
          });
          polylineGroup.addLayer(polyline);

          // Add track segment direction arrows
          for (let i = 0; i < path.length - 1; i++) {
            const p1 = path[i];
            const p2 = path[i + 1];
            const bearing = calculateBearing(p1[0], p1[1], p2[0], p2[1]);
            const midLat = (p1[0] + p2[0]) / 2;
            const midLng = (p1[1] + p2[1]) / 2;

            const arrowIcon = L.divIcon({
              className: 'track-direction-arrow',
              html: `<div style="transform: rotate(${bearing}deg); width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5">
                  <polygon points="12 2 19 21 12 17 5 21 12 2"/>
                </svg>
              </div>`,
              iconSize: [18, 18],
              iconAnchor: [9, 9]
            });

            const arrowMarker = L.marker([midLat, midLng], {
              icon: arrowIcon,
              interactive: false
            });
            polylineGroup.addLayer(arrowMarker);
          }
        }
      });
    }

      const followLatest = document.getElementById('follow-latest').checked;
      const isNewPointAdded = locations.length !== lastPointCount;
      lastPointCount = locations.length;

      if (boundsPoints.length > 0) {
        if (isNewPointAdded) {
          const latestPoint = boundsPoints[0]; // Newest point is first in boundsPoints
          if (followLatest) {
            map.panTo(latestPoint, { animate: true });
          } else if (lastPointCount <= 1) {
            map.fitBounds(boundsPoints, { padding: [50, 50], maxZoom: 16 });
          }
        }
      }
    }

    document.getElementById('show-path').addEventListener('change', () => {
      fetchLocations();
    });

    document.getElementById('auto-refresh').addEventListener('change', (e) => {
      if (e.target.checked) {
        startAutoRefresh();
      } else {
        clearInterval(autoRefreshInterval);
      }
    });

    function startAutoRefresh() {
      clearInterval(autoRefreshInterval);
      autoRefreshInterval = setInterval(fetchLocations, 2000);
    }

    fetchLocations();
    startAutoRefresh();
  </script>
</body>

</html>
